name: CI - Linting Check

on:
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 16

  

      - name: Run Stylelint
        run: stylelint "styles/**/*.css" --config .stylelintrc.json
